name: Update Google Scholar Citation Badge

on:
  schedule:
    - cron: "0 0 * * *"  # 每天自动更新
  workflow_dispatch:     # 允许手动触发更新

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library
        run: pip install scholarly

      - name: Generate citation JSON
        run: |
          cat <<EOF > citation_json.py
          from scholarly import scholarly
          import json

          author = scholarly.search_author_id("9rqTLMcAAAAJ")
          author = scholarly.fill(author, sections=["indices"])
          citations = author["citedby"]

          data = {
            "schemaVersion": 1,
            "label": "citations",
            "message": str(citations),
            "color": "blue"
          }

          with open("badges/citations.json", "w") as f:
              json.dump(data, f)
          EOF

      - name: Create badges folder if not exists
        run: mkdir -p badges

      - name: Run script to generate JSON
        run: python citation_json.py

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/citations.json
          git commit -m "Update citations badge" || echo "No changes"
          git push

